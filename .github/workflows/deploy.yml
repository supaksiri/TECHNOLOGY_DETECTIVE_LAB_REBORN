name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck (diagnostic)
        continue-on-error: true
        run: npm run typecheck
      - name: Run tests (diagnostic)
        continue-on-error: true
        run: npm run test
      - name: Build Vite
        run: npm run build
        env:
          GITHUB_REPOSITORY: supaksiri/TECHNOLOGY_DETECTIVE_LAB_REBORN
      - name: Verify built output
        run: |
          test -f dist/index.html
          test -d dist/assets
          grep -q '/TECHNOLOGY_DETECTIVE_LAB_REBORN/assets/' dist/index.html
          echo 'Vite output verified for GitHub Pages project path'
          sed -n '1,35p' dist/index.html
      - name: Build static fallback for source-based Pages publishing
        run: npm run build -- --base /TECHNOLOGY_DETECTIVE_LAB_REBORN/published/ --outDir published
      - name: Verify fallback artifact
        run: |
          test -f published/index.html
          test -d published/assets
          grep -q '/TECHNOLOGY_DETECTIVE_LAB_REBORN/published/assets/' published/index.html
      - name: Commit compiled fallback to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f published/
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish compiled web fallback [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
